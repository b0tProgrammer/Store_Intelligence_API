services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
    environment:
      - DB_PATH=/app/data/store_intelligence.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  db-data:
