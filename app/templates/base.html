<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Store Intelligence{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <span class="brand">Purplle Store Intelligence</span>
    <span id="connection-status" class="badge badge-connecting">Connecting…</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
